name: Check and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: chudin-note-youtube-unpacked
          path: artifacts/*.zip
